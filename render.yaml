services:
  - type: web
    name: turingiq-video-generator
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SARVAM_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: MAX_CLIP_WORKERS
        value: "1"
      # SharePoint upload (optional, add later in Render -> Environment):
      # MS_TENANT_ID, MS_CLIENT_ID, MS_REFRESH_TOKEN, SHAREPOINT_FOLDER_URL - see README
